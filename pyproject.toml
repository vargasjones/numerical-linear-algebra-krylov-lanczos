[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-linear-algebra-krylov-lanczos"
version = "0.1.0"
description = "Numerical linear algebra with Krylov subspaces, Lanczos eigensolvers, re-orthogonalization, shift-and-invert, and spectral error analysis."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "threadpoolctl>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
